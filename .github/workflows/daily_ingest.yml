# Digest + Price Scraper — 5x/day
#
# Runs at: 5 AM, 9 AM, 12 PM, 3 PM, 6 PM IST
# Step 1: Wake HF Space + generate digest (news)
# Step 2: Scrape prices from kisandeals.com + push directly to Supabase

name: News & Prices (5x/day)

on:
  schedule:
    - cron: '30 23 * * *'   # 5:00 AM IST
    - cron: '30 3 * * *'    # 9:00 AM IST
    - cron: '30 6 * * *'    # 12:00 PM IST
    - cron: '30 9 * * *'    # 3:00 PM IST
    - cron: '30 12 * * *'   # 6:00 PM IST
  workflow_dispatch:

jobs:
  generate-digest-and-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Generate digest via HF Space
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "ERROR: BACKEND_URL not set"
            exit 1
          fi

          echo "=== Waking HF Space ==="
          curl -s "$BACKEND_URL/" --max-time 120 || true
          sleep 5

          echo "=== Generating digest ==="
          HTTP_CODE=$(curl -s -X POST "$BACKEND_URL/api/digest/generate" \
            -H "Content-Type: application/json" \
            --max-time 120 --retry 3 --retry-delay 10 \
            -w "%{http_code}" -o /tmp/digest.json)
          echo "Digest HTTP: $HTTP_CODE"
          cat /tmp/digest.json
          echo ""

      - name: Scrape prices and push to Supabase
        run: |
          pip install httpx beautifulsoup4 > /dev/null 2>&1

          python3 << 'PYTHON_SCRIPT'
          import httpx, json, os
          from bs4 import BeautifulSoup
          from datetime import date

          SUPABASE_URL = os.environ.get("SUPABASE_URL", "")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY", "")

          if not SUPABASE_URL or not SUPABASE_KEY:
              print("ERROR: SUPABASE_URL or SUPABASE_KEY not set")
              exit(1)

          CROPS = {
              "arecanut-betelnut-supari": ("Arecanut", "ಅಡಿಕೆ"),
              "coconut": ("Coconut", "ತೆಂಗು"),
              "copra": ("Copra", "ಕೊಬ್ಬರಿ"),
              "paddy-dhan-common": ("Rice", "ಭತ್ತ"),
              "black-pepper": ("Black Pepper", "ಕಾಳುಮೆಣಸು"),
              "cashewnuts": ("Cashew", "ಗೋಡಂಬಿ"),
              "banana": ("Banana", "ಬಾಳೆ"),
          }

          # No APMC filter — save ALL Karnataka mandis from napanta

          today = str(date.today())
          all_rows = []

          for slug, (crop_en, crop_kn) in CROPS.items():
              date_str = date.today().strftime("%d-%b-%Y")
              url = f"https://www.napanta.com/agri-commodity-prices/karnataka/{slug}/{date_str}/"
              try:
                  r = httpx.get(url, timeout=20, follow_redirects=True)
                  if r.status_code != 200:
                      print(f"  {crop_en}: HTTP {r.status_code}")
                      continue

                  soup = BeautifulSoup(r.text, "html.parser")
                  tables = soup.find_all("table")

                  # Find mandi-level table (has District, Market columns)
                  price_table = None
                  for t in tables:
                      trs = t.find_all("tr")
                      if len(trs) > 3:
                          hdr = " ".join(h.text.strip().lower() for h in trs[0].find_all(["th","td"]))
                          if "district" in hdr or "market" in hdr:
                              price_table = t
                              break

                  if not price_table:
                      print(f"  {crop_en}: no price table")
                      continue

                  rows = price_table.find_all("tr")[1:]
                  count = 0

                  for row in rows:
                      cells = row.find_all("td")
                      if len(cells) < 7:
                          continue
                      district = cells[0].text.strip()
                      market = cells[1].text.strip()
                      try:
                          def pp(txt):
                              return int(float(txt.replace("₹","").replace(",","").replace(" ","").strip()))
                          max_p = pp(cells[4].text)
                          modal_p = pp(cells[5].text)
                          min_p = pp(cells[6].text)
                      except:
                          continue
                      if min_p <= 0 and max_p <= 0:
                          continue

                      all_rows.append({
                          "crop": crop_en,
                          "crop_kn": crop_kn,
                          "apmc": market,
                          "min_price": min_p,
                          "max_price": max_p,
                          "modal_price": modal_p,
                          "date": today,
                          "source": "napanta",
                      })
                      count += 1

                  print(f"  {crop_en}: {count} mandis scraped")

              except Exception as e:
                  print(f"  {crop_en}: ERROR {e}")

          # Push to Supabase using urllib (avoids GitHub secret masking issue with httpx)
          if all_rows:
              print(f"\nPushing {len(all_rows)} price rows to Supabase...")
              import urllib.request
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/mandi_prices",
                  data=json.dumps(all_rows).encode("utf-8"),
                  method="POST",
              )
              req.add_header("apikey", SUPABASE_KEY)
              req.add_header("Authorization", f"Bearer {SUPABASE_KEY}")
              req.add_header("Content-Type", "application/json")
              req.add_header("Prefer", "resolution=merge-duplicates")
              try:
                  resp = urllib.request.urlopen(req, timeout=30)
                  print(f"Supabase response: {resp.status}")
              except urllib.error.HTTPError as e:
                  print(f"Supabase error: {e.code} {e.read().decode()[:500]}")
          else:
              print("No prices scraped — nothing to push")

          PYTHON_SCRIPT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
