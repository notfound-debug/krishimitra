# Digest Generator — 5x/day
#
# Runs at: 5 AM, 9 AM, 12 PM, 3 PM, 6 PM IST
# Each run: fetches RSS → keyword categorize → small LLM call for action lines → saves to Supabase
# Also keeps HuggingFace Space awake (prevents 48h sleep)

name: News Digest (5x/day)

on:
  schedule:
    - cron: '30 23 * * *'   # 5:00 AM IST
    - cron: '30 3 * * *'    # 9:00 AM IST
    - cron: '30 6 * * *'    # 12:00 PM IST
    - cron: '30 9 * * *'    # 3:00 PM IST
    - cron: '30 12 * * *'   # 6:00 PM IST
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Space and generate digest
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"

          if [ -z "$BACKEND_URL" ]; then
            echo "ERROR: BACKEND_URL secret not set."
            echo "Go to repo Settings → Secrets → Add: BACKEND_URL = https://sisaram-krish.hf.space"
            exit 1
          fi

          echo "=== Waking up HuggingFace Space ==="
          # First request wakes the Space if it's sleeping
          curl -s "$BACKEND_URL/" --max-time 120 || true
          sleep 5

          echo "=== Generating digest ==="
          HTTP_CODE=$(curl -s -X POST \
            "$BACKEND_URL/api/digest/generate" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            -w "%{http_code}" \
            -o /tmp/response.json)

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Digest generation failed with status $HTTP_CODE"
            exit 1
          fi

          echo "=== Digest generated successfully ==="
